# Lamark Hermes-home configuration template.
#
# Installed by scripts/setup.sh into $HERMES_HOME/config.yaml. Uses the
# `custom` provider, not `lm-studio`: `custom` reads base_url directly
# from this file on every API call (no env-var dance, no launchd-plist
# rewriting), and the endpoint appears in `/model` pickers under
# Custom Models. Works with any OpenAI-compatible endpoint (vLLM,
# ollama, LM Studio app, TGI).

model:
  default: qwen-base
  provider: custom
  base_url: http://127.0.0.1:8000/v1
  context_length: 131072

custom_providers:
  - name: lamark-local
    base_url: http://127.0.0.1:8000/v1
    api_key: not-needed
    models:
      - name: qwen-base
        context_length: 131072
        transport: openai_chat

model_aliases:
  qwen-base:
    model: qwen-base
    provider: custom
    base_url: http://127.0.0.1:8000/v1
