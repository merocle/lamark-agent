[project]
name = "lamark-agent"
version = "0.1.0-alpha"
description = "Lamark — locally-hosted personal AI agent that learns from accumulated dialogue. Fork of Hermes Agent (Nous Research, MIT)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Lamark contributors" }]
keywords = ["ai", "agent", "local-llm", "qwen", "dgx-spark", "personal-ai", "lamark"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core runtime — pinned to known-good ranges for Spark sm_121
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7",
    "structlog>=24",
    "tenacity>=8.2",
    "platformdirs>=4.2",
    "pyyaml>=6.0",
    "tomli-w>=1.0",

    # Memory + retrieval
    "lancedb>=0.13,<1",
    "pyarrow>=16,<19",

    # Embeddings (bge-m3 via sentence-transformers; CPU-friendly fallback OK)
    "sentence-transformers>=3,<4",

    # Redaction / PII
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",

    # FTS5 for cross-session recall
    "sqlite-utils>=3.36",

    # Honcho-style user model
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
# Heavy ML deps installed on Spark only — keep main install thin on dev laptop
spark = [
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
    "vllm>=0.7,<1",
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.11",
    "bitsandbytes>=0.44 ; platform_system == 'Linux'",
    "unsloth>=2024.10 ; platform_system == 'Linux'",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipython>=8.27",
]

[project.scripts]
lamark = "lamark.cli:main"

[project.urls]
Homepage = "https://lamark.dev"
Repository = "https://github.com/lamark-agent/lamark-agent"
Issues = "https://github.com/lamark-agent/lamark-agent/issues"
"Upstream (Hermes Agent)" = "https://github.com/NousResearch/hermes-agent"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lamark"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length governed by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
