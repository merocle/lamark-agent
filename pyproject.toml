[project]
name = "lamark-agent"
version = "0.1.0a0"
description = "Lamark — locally-hosted personal AI agent that learns from accumulated dialogue. Fork of Hermes Agent (Nous Research, MIT)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "Lamark contributors" }]
keywords = ["ai", "agent", "local-llm", "qwen", "dgx-spark", "personal-ai", "lamark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Thin core — installs everywhere (mac dev laptop included).
    # Heavy ML / vector / NLP deps live in optional extras below to avoid
    # blocking local dev on architecture-specific wheel availability.
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7",
    "structlog>=24",
    "tenacity>=8.2",
    "platformdirs>=4.2",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "sqlalchemy>=2,<3",
    "sqlite-utils>=3.36",
]

[project.optional-dependencies]
# Vector / memory layer — installed on Spark and on dev machines with working wheels.
memory = [
    "lancedb>=0.13,<1",
    "pyarrow>=16",
    "sentence-transformers>=3,<4",
]

# PII / secrets redaction (needs presidio + spacy model download).
redaction = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]

# Heavy ML deps — Spark only. Linux/CUDA required for most.
spark = [
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
    "vllm>=0.7,<1",
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.11",
    "bitsandbytes>=0.44 ; platform_system == 'Linux'",
    "unsloth>=2024.10 ; platform_system == 'Linux'",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipython>=8.27",
]

[project.scripts]
lamark = "lamark.cli:main"

[project.urls]
Homepage = "https://github.com/merocle/lamark-agent"
Repository = "https://github.com/merocle/lamark-agent"
Issues = "https://github.com/merocle/lamark-agent/issues"
"Upstream (Hermes Agent)" = "https://github.com/NousResearch/hermes-agent"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lamark"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length governed by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
