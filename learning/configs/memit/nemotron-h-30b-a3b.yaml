# MEMIT hyperparameters for NVIDIA Nemotron-H-3-Nano-30B-A3B-BF16.
#
# Status: RESEARCH-GRADE. NemotronH is NOT in EasyEdit's officially supported
# model list. Parameter names below were verified against the model's
# safetensors index on 2026-05-29. The real architecture:
#
#   * 52 layers total, prefixed `backbone.layers.{i}` (NOT `model.layers`).
#   * Layers alternate Mamba / MoE / Attention. Only MoE layers carry
#     `down_proj` weights; Mamba and Attention layers must NOT be named here.
#     The MoE layer indices are [1,3,6,8,10,13,15,17,20,22,24,27,29,31,34,36,
#     38,40,43,45,47,49,51]; mid-stack ones are [20,22,24,27,29].
#   * Each MoE layer = 128 routed experts (`mixer.experts.{0..127}`) gated by
#     `mixer.gate`, PLUS an always-active `mixer.shared_experts` module that
#     every token flows through regardless of routing.
#
# We target the SHARED expert's down_proj. Editing a routed expert would only
# affect tokens the router happens to send to it (the routing-lottery problem);
# the shared expert is on every token's forward path, so a MEMIT edit there
# actually surfaces. It is also a single matrix per layer — no expert loop.
#
# The first round of empirical testing should sweep `layers` and pick whichever
# survives the eval probes in learning/data/lamark_facts.jsonl best. Track
# results in .ai/research/.

# Which layers to edit — mid-stack MoE layers only (verified MoE indices).
layers: [20, 22, 24, 27, 29]

# Rewrite-module path. {} is the layer index (filled by EasyEdit). No
# {expert} slot: the shared expert is a single module per layer.
rewrite_module_tmp: "backbone.layers.{}.mixer.shared_experts.down_proj"

# Module paths used by EasyEdit for the K* covariance hook + the KL/v-loss
# constraint. mlp_module_tmp is the parent of the rewritten down_proj so the
# covariance is collected over that module's input, mirroring the dense-MLP
# convention (rewrite = <mlp>.down_proj, mlp = <mlp>).
layer_module_tmp: "backbone.layers.{}"
mlp_module_tmp: "backbone.layers.{}.mixer.shared_experts"
attn_module_tmp: "backbone.layers.{}.mixer"
ln_f_module: "backbone.norm_f"
lm_head_module: "lm_head"

# MEMIT specifics.
# layer_selection: "all" applies the batched update across all `layers` at
# once (vs "random"). stats_dir is where EasyEdit caches the mom2 covariance;
# it points at the mounted EasyEdit checkout so the expensive covariance
# survives across runs.
layer_selection: "all"
stats_dir: "/easyedit/data/stats"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 0.5
v_loss_layer: 50          # near-final layer (NemotronH-30B has 52)
v_weight_decay: 0.5
clamp_norm_factor: 0.75
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000

# Covariance estimation (the K* term in the MEMIT update).
# "wikitext" maps to wikitext-103-raw-v1 in EasyEdit's layer_stats loader,
# which still loads under modern `datasets`; the "wikipedia"/"20200501.en"
# beam config is broken there and pulls a tens-of-GB dump. Sample count is
# kept modest because covariance runs forward passes through the full 30B
# model — 100k is impractical here; a few thousand gives a usable C.
mom2_dataset: "wikitext"
mom2_n_samples: 3000
mom2_dtype: "float32"

# Runner-only flags (consumed by edit_runner.py, NOT by EasyEdit directly).
# Unused while targeting the shared expert (rewrite_module_tmp has no {expert}
# slot, so _expand_moe_template yields a single pass). Kept for the documented
# routed-expert alternative: set rewrite_module_tmp to
# "backbone.layers.{}.mixer.experts.{expert}.down_proj" to re-enable them.
moe_all_experts: false
moe_num_experts: 128       # verified: experts 0..127 per MoE layer
moe_expert_index: 0
device: 0
dtype: "bfloat16"
