[project]
name = "lamark-train"
version = "0.1.0a0"
description = "Lamark — Python training pipeline (LoRA/SFT/DPO) for the lamark monorepo. Fork of Hermes Agent (Nous Research, MIT)."
license = { file = "../LICENSE" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "Lamark contributors" }]
keywords = ["ai", "fine-tuning", "lora", "qwen", "dgx-spark", "lamark"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "structlog>=24",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2,<3",
    "sqlite-utils>=3.36",
]

[project.optional-dependencies]
# PII / secrets redaction (needs presidio + spacy model download).
redaction = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]

# Heavy ML deps — Spark only. Linux/CUDA required for most.
spark = [
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
    "vllm>=0.7,<1",
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.11",
    "bitsandbytes>=0.44 ; platform_system == 'Linux'",
    "unsloth>=2024.10 ; platform_system == 'Linux'",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipython>=8.27",
]

[project.scripts]
lamark-train = "lamark.train.dispatcher:main"

[project.urls]
Homepage = "https://lamark.dev"
Repository = "https://github.com/lamark-agent/lamark-agent"
Issues = "https://github.com/lamark-agent/lamark-agent/issues"
"Upstream (Hermes Agent)" = "https://github.com/NousResearch/hermes-agent"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lamark"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length governed by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
