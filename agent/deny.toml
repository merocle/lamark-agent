[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
unlicensed = "deny"
copyleft   = "deny"
default    = "deny"

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl-sys" },   # we use rustls
]

[advisories]
db-path       = "~/.cargo/advisory-db"
vulnerability = "deny"
unmaintained  = "warn"
yanked        = "deny"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-git        = []
